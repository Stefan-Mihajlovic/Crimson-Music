name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and lint
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Android and web behavior tests
        run: npm run test:platforms
      - name: Expo compatibility
        run: npx expo-doctor

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export static web application
        run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: crimson-web
          path: dist/
          retention-days: 7

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Generate native Android project and media adapter
        run: npx expo prebuild --platform android --no-install
      - name: Compile standalone Android application (32-bit and 64-bit ARM)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: crimson-android-device
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  ios-build:
    # The layered Sonata icon uses Icon Composer 2 / Xcode 27 materials.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Xcode and compile the layered app icon
        run: |
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if [[ "$xcode_version" != "Xcode 27."* ]]; then
            echo "::error::The layered app icon requires the Xcode 27 runner."
            exit 1
          fi
          mkdir -p .build/icon-check
          xcrun actool assets/Crimson.icon --compile .build/icon-check \
            --output-format human-readable-text --notices --warnings \
            --output-partial-info-plist .build/icon-check/icon-info.plist \
            --app-icon Crimson --compress-pngs --target-device iphone \
            --minimum-deployment-target 16.4 --platform iphoneos
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Prepare build scripts and CocoaPods
        run: |
          node scripts/fix-expo-ios-paths.js
          pod install --project-directory=ios
      - name: Compile unsigned iOS application
        run: >-
          xcodebuild -workspace ios/CrimsonMusic.xcworkspace
          -scheme CrimsonMusic -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
